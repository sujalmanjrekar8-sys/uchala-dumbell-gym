<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - Uchala Dumbell Gym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        
    <div class="login-wrapper">
        <div class="login-card">

           
            <img src="images/logo.png" alt="Logo" class="logo-img">
            <h2>Owner Login</h2>
            <p>Uchala Dumbell Gym — Admin Portal</p>

            
            <form id="ownerLoginForm">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button type="submit">Sign In</button>

                <div style="margin-top: 15px; text-align: center;">
                    <button type="button" id="btnResetOwner" style="background: transparent; border: 1px solid #444; color: #ff5e3a; padding: 7px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.3s; width: 100%;">
                        ⚡ Quick Fix: Seed Owner (sujalsir / sualstar) in MongoDB
                    </button>
                </div>

            </form>

            <p style="margin-top: 15px;"><a href="index.html">← Back to Home</a></p>

        </div>
    </div>

    

    <script src="script.js"></script>
</body>
</html>
